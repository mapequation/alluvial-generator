name: Publish npm package

# Publishes @mapequation/alluvial-diagram to npm with trusted publishing when a GitHub release is published.
# The release tag must match the version in packages/alluvial-diagram/package.json, like v1.16.0.

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/alluvial-diagram

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - name: Test
        run: pnpm test

      # prepack builds dist/, which the package ships, so the tarball goes outside it
      - name: Pack
        run: pnpm pack --pack-destination ../../npm

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm
          path: npm/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: npm
      url: https://www.npmjs.com/package/@mapequation/alluvial-diagram

    permissions:
      id-token: write

    steps:
      # Node 24 bundles npm 11.5.1 or later, which trusted publishing needs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm
          path: npm/

      - name: Publish
        run: npm publish ./npm/*.tgz
