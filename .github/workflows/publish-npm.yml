name: Publish npm package

# Publishes @mapequation/alluvial-diagram to npm with trusted publishing when a GitHub release is published.
# The release tag must match the version in packages/alluvial-diagram/package.json, like v1.16.0.

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # As in pages.yml
      - name: Install
        run: |
          npm install --package-lock-only
          npm ci

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./packages/alluvial-diagram/package.json').version")" = "$TAG"

      - name: Test
        run: npm test -w @mapequation/alluvial-diagram

      # npm pack doesn't build, and dist/ is what the package ships
      - name: Build
        run: npm run build -w @mapequation/alluvial-diagram

      - name: Pack
        run: |
          mkdir -p npm
          npm pack -w @mapequation/alluvial-diagram --pack-destination "$PWD/npm"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm
          path: npm/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: npm
      url: https://www.npmjs.com/package/@mapequation/alluvial-diagram

    permissions:
      id-token: write

    steps:
      # Node 24 bundles npm 11.5.1 or later, which trusted publishing needs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm
          path: npm/

      - name: Publish
        run: npm publish ./npm/*.tgz
